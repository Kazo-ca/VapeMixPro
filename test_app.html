<!DOCTYPE html>
<html>
<head>
    <title>Test VapeMix Pro</title>
    <script>
        async function testApp() {
            const results = [];
            
            // Test 1: Load the page
            try {
                const response = await fetch('http://localhost:8080/index.html');
                const html = await response.text();
                
                // Check if CSS is linked
                if (html.includes('href="style.css"')) {
                    results.push('✓ CSS file is properly linked');
                } else {
                    results.push('✗ CSS file is NOT linked');
                }
                
                // Check if JS is linked
                if (html.includes('src="script.js"')) {
                    results.push('✓ JavaScript file is properly linked');
                } else {
                    results.push('✗ JavaScript file is NOT linked');
                }
                
                // Check if Bootstrap is included
                if (html.includes('bootstrap')) {
                    results.push('✓ Bootstrap is included');
                } else {
                    results.push('✗ Bootstrap is NOT included');
                }
                
                // Check if Font Awesome is included
                if (html.includes('font-awesome')) {
                    results.push('✓ Font Awesome is included');
                } else {
                    results.push('✗ Font Awesome is NOT included');
                }
                
            } catch (error) {
                results.push('✗ Error loading page: ' + error.message);
            }
            
            // Test 2: Check if CSS file exists
            try {
                const response = await fetch('http://localhost:8080/style.css');
                if (response.ok) {
                    const css = await response.text();
                    if (css.length > 100) {
                        results.push('✓ CSS file exists and has content (' + css.length + ' bytes)');
                    } else {
                        results.push('✗ CSS file is too small');
                    }
                } else {
                    results.push('✗ CSS file not found (404)');
                }
            } catch (error) {
                results.push('✗ Error loading CSS: ' + error.message);
            }
            
            // Test 3: Check if JS file exists
            try {
                const response = await fetch('http://localhost:8080/script.js');
                if (response.ok) {
                    const js = await response.text();
                    if (js.length > 100) {
                        results.push('✓ JavaScript file exists and has content (' + js.length + ' bytes)');
                    } else {
                        results.push('✗ JavaScript file is too small');
                    }
                    
                    // Check for key functions
                    if (js.includes('calculateForward')) {
                        results.push('✓ calculateForward function found');
                    }
                    if (js.includes('calculateReverse')) {
                        results.push('✓ calculateReverse function found');
                    }
                    if (js.includes('saveHistory')) {
                        results.push('✓ saveHistory function found');
                    }
                } else {
                    results.push('✗ JavaScript file not found (404)');
                }
            } catch (error) {
                results.push('✗ Error loading JavaScript: ' + error.message);
            }
            
            // Display results
            document.getElementById('results').innerHTML = results.join('<br>');
        }
    </script>
</head>
<body onload="testApp()">
    <h1>VapeMix Pro - Test Results</h1>
    <div id="results">Testing...</div>
</body>
</html>
